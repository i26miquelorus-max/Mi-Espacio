<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Espacio</title>
<style>
:root{--navy:#202124;--amber:#1a73e8;--bg:#f8fafd;--sf:#fff;--ink:#1f1f1f;--mu:#5f6368;--ln:#e1e3e1;--hv:#f0f4f9;--sl:#c2e7ff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 Roboto,"Google Sans",Arial,sans-serif}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:7px 16px;cursor:pointer}
button:hover{background:var(--hv)}
button.pr{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:500}
button.pr:hover{background:#1765cc}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.it:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#top{display:flex;align-items:center;gap:16px;height:64px;padding:8px 16px;flex:none}
.lg{display:flex;align-items:center;gap:10px;width:224px;font:400 22px/1 "Google Sans",Roboto,Arial,sans-serif;color:var(--mu)}
#q{flex:1;max-width:720px;height:46px;border:0;border-radius:24px;background:#e9eef6;padding:0 20px;font:inherit;font-size:16px}
#q:focus{background:#fff;box-shadow:0 1px 4px #0004}
#shell{flex:1;min-height:0;display:flex}
aside{width:256px;flex:none;padding:4px 12px 12px;display:flex;flex-direction:column;gap:2px}
.nw{position:relative;margin-bottom:12px}

#bNew:hover{box-shadow:0 2px 8px #0004;background:var(--bg)}
#bNew b{font-size:28px;font-weight:400;color:#4285f4;line-height:1}
#nm{position:absolute;top:62px;left:0;background:#fff;border-radius:8px;box-shadow:0 2px 10px #0004;padding:8px 0;min-width:240px;z-index:15}

#nm button:hover,#menu button:hover{background:var(--hv)}
.nv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;border-radius:24px;padding:0 16px;height:36px}
.nv:hover{background:#0000000d}.nv.on{background:var(--sl);font-weight:500}
.sp{flex:1}
.stg{padding:12px 16px;font-size:13px;color:var(--mu)}
.bar{height:4px;border-radius:2px;background:#dadce0;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);width:0}
.sm{border:0;background:none;color:var(--amber);padding:6px 16px;text-align:left;font-size:13px}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:16px;margin:0 16px 16px 0;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px;gap:10px}

.crumbs button{border:0;background:none;font:inherit;padding:4px 10px;border-radius:18px}
.crumbs b{font-weight:400;padding:4px 10px;color:var(--ink)}.crumbs button.dz{background:var(--sl)}
#list{flex:1;overflow:auto;padding:0 20px 24px}
.it{position:relative;cursor:pointer;user-select:none}
.it:hover{background:var(--hv)}.it.sel{background:var(--sl)}.it.drop{outline:2px solid var(--amber)}
.nm{display:flex;gap:8px;align-items:center;min-width:0;flex:1}.nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st{color:var(--mu)}
.ic{display:flex;align-items:center;justify-content:center}
.mo{border:0;background:none;padding:0;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:700}.mo:hover{background:#0001}
.ow,.dt,.sz{color:var(--mu)}
.ls .lh,.ls .it{display:grid;grid-template-columns:40px minmax(160px,1fr) 110px 170px 110px 36px;align-items:center;padding:0 8px}
.ls .lh{height:44px;color:var(--mu);font-weight:500;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#fff;z-index:2}
.hd{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;border-radius:4px}.hd:hover{background:none;color:var(--ink)}
.ls .it{height:48px;border-bottom:1px solid var(--ln)}
.gd h3{font:500 14px Roboto,Arial,sans-serif;color:var(--mu);margin:16px 0 8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gd .it{background:var(--hv);border-radius:12px;overflow:hidden}.gd .it:hover{background:#e6ecf4}.gd .it.sel{background:var(--sl)}
.gd .it.cf,.gd .ch{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;height:48px}
.gd .ch{height:44px;padding:0 6px 0 12px}
.cb{height:150px;margin:0 8px 8px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.cb img{width:100%;height:100%;object-fit:cover}
.em{text-align:center;color:var(--mu);padding:80px 0}
#menu{position:fixed;background:#fff;border-radius:8px;box-shadow:0 2px 10px #0004;padding:6px 0;min-width:220px;z-index:20}
#pv{position:fixed;inset:0;background:#202124ee;display:flex;flex-direction:column;z-index:30}

#pb iframe{width:100%;height:100%}

#dgl{max-height:260px;overflow:auto;border:1px solid var(--ln);border-radius:8px;margin-bottom:16px}
.pk{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:9px 14px}.pk.on{background:var(--sl)}

.ta{background:none;border:0;color:#8ab4f8;padding:0 0 0 24px;font-weight:500;border-radius:0}.ta:hover{background:none;text-decoration:underline}
.nv svg{fill:var(--mu);flex:none}.nv.on svg{fill:var(--ink)}
.tabs{display:flex;gap:4px;width:100%;border-bottom:1px solid var(--ln);margin-bottom:2px}.tabs button{border:0;border-radius:8px 8px 0 0;background:none;padding:6px 18px}.tabs button.on{background:var(--sl);font-weight:500}
.tp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}.tp[hidden]{display:none}
#pp{position:fixed;z-index:35;background:#fff;color:#1f1f1f;border-radius:8px;box-shadow:0 2px 12px #0005;padding:10px}
.sw{display:grid;grid-template-columns:repeat(8,22px);gap:4px}.sw button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid #0003;min-width:0}
.sr{display:flex;gap:8px;align-items:center;margin-top:8px}.sr input{width:34px;height:28px;padding:0;border:0;background:none}.sr button{font-size:12px;padding:4px 10px}
.sy{display:grid;grid-template-columns:repeat(10,34px);gap:2px}.sy button{border:0;padding:4px;font-size:18px;border-radius:6px;background:none;min-width:0}.sy button:hover{background:var(--hv)}
#sheet ul.ck{list-style:none;padding-left:4px}#sheet ul.ck input{margin-right:8px;width:16px;height:16px;vertical-align:middle}

#dz.on{display:flex}
@media(max-width:800px){#shell{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.stg,.sp,.sm,.lg span{display:none}.lg{width:auto}.nw{margin:0}.ls .lh,.ls .it{grid-template-columns:40px 1fr 36px}.ow,.dt,.sz,.ls .lh span,.ls .lh .hd+.hd,.ls .lh .hd:nth-of-type(n+2){display:none}main{margin:0 8px 8px}}
body.ing #top,body.ing #shell,body.ing #dz{display:none!important}
#ed{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#d9dce6}
#ed[hidden]{display:none}
.et,.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px}
.et{background:#fff;color:#1f1f1f;border-bottom:1px solid var(--ln)}.et .sp{flex:1}
.et input{font:500 17px Roboto,Arial,sans-serif;padding:6px 10px;border-radius:8px;border:1px solid var(--ln);min-width:160px}
.et select,.tl select{font:inherit;padding:5px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);max-width:130px}
.tl{background:var(--sf);border-bottom:1px solid var(--ln)}
.tl button{padding:5px 9px;min-width:32px}
.tl .sep{width:1px;height:22px;background:var(--ln)}
.cl{display:flex;align-items:center;gap:3px;font-weight:700}.cl input{width:28px;height:26px;padding:0;border:0;background:none}
#eFind{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;background:#e8f0fe;border-bottom:1px solid var(--ln)}
#eFind[hidden]{display:none}#eFind input[type=text]{padding:5px 8px;border:1px solid var(--ln);border-radius:8px}
#eScroll{flex:1;overflow:auto;padding:22px 12px}
#sheet{background:#fff;color:#111;margin:0 auto;box-shadow:0 2px 14px #0003;width:794px;max-width:100%;min-height:1123px;padding:72px 80px;font:12pt/1.55 Calibri,Carlito,"Segoe UI",Arial,sans-serif;outline:none;overflow-wrap:anywhere}
body.web #sheet{width:100%;max-width:960px;min-height:70vh;padding:32px 40px}
body.dk #ed{background:#161923}body.dk #sheet{background:#242836;color:#e8eaf2}
#sheet h1{font-size:28px;margin:.6em 0 .3em}#sheet h2{font-size:22px}#sheet h3{font-size:18px}
#sheet table{border-collapse:collapse;margin:8px 0}#sheet td,#sheet th{border:1px solid #999;padding:6px 10px;min-width:60px}
#sheet blockquote{border-left:4px solid var(--amber);margin-left:0;padding-left:14px;color:#666}
#sheet pre{background:#eef0f5;color:#111;padding:12px;border-radius:8px;font:13px ui-monospace,Consolas,monospace}
#sheet img{max-width:100%}#sheet img.si{outline:3px solid var(--amber)}
#sheet .pb{border-top:2px dashed #aab;margin:24px 0;height:0}
.eb{padding:5px 14px;background:var(--sf);border-top:1px solid var(--ln);color:var(--mu);font-size:12.5px}
#ed.rd .tl,#ed.rd #eFind{display:none}
#eOut{display:none;position:fixed;top:12px;right:16px;z-index:5}
body.foc .et,body.foc .tl,body.foc #eFind,body.foc .eb{display:none}body.foc #eOut{display:block}
@media print{body{display:block!important;background:#fff}body>*:not(#ed){display:none!important}#ed{position:static;display:block;background:#fff}.et,.tl,#eFind,.eb,#eOut{display:none!important}#eScroll{overflow:visible;padding:0}#sheet{box-shadow:none;margin:0;width:auto;zoom:1!important;min-height:0;padding:0;background:#fff!important;color:#000!important}#sheet .pb{border:0;page-break-after:always}}
</style>
</head>

</div>
<div id="menu" hidden></div>
<div id="pv" hidden><header><span id="pt"></span><button id="pS" class="pr" hidden>Guardar</button><button id="pD">Descargar</button><button id="pX">Cerrar</button></header><div id="pb"></div></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function bump(d){restore();var n=rg&&rg.startContainer;if(!n)return;if(n.nodeType==1&&n.childNodes[rg.startOffset])n=n.childNodes[rg.startOffset];while(n&&n.nodeType==1&&n.firstChild)n=n.firstChild;n=n.nodeType==1?n:n.parentNode;var z=parseFloat(getComputedStyle(n).fontSize)||16;size(Math.round(Math.max(6,Math.min(120,z+d*(z>=24?4:z>=14?2:1)))))}
var F={

async function act(c,btn){if(c=='sym')return popup(btn,symGrid);if(c=='date')return ex('insertText',new Date().toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'}));if(c=='chk')return ex('insertHTML','<ul class="ck"><li><input type="checkbox">&nbsp;</li></ul>');if(c=='big'||c=='sml')return bump(c=='big'?1:-1);
  if(c=='link'){var u=await ask('Dirección del enlace','https://');if(u)ex('createLink',u)}
  else if(c=='img')$('#fImg').click();
  else if(c=='tbl'){var v=(await ask('Filas x columnas','3x3')||'').split(/[x×]/i),r=+v[0],k=+v[1];if(r>0&&k>0&&r<60&&k<20){var h='<table><tbody>';for(var i=0;i<r;i++){h+='<tr>';for(var j=0;j<k;j++)h+='<td><br></td>';h+='</tr>'}ex('insertHTML',h+'</tbody></table><p><br></p>')}}
  else if(c=='row'||c=='col'||c=='dtbl')tbl(c);
  else if(c=='pb')ex('insertHTML','<div class="pb"><br></div><p><br></p>');
  else if(c=='find'){var f=$('#eFind');f.hidden=!f.hidden;if(!f.hidden)$('#fq').focus()}
  else ex(c);
}
function tbl(c){
  var nd=rg&&rg.startContainer,td=nd&&(nd.nodeType==1?nd:nd.parentNode).closest('td,th');
  if(!td)return toast('Coloca el cursor dentro de una tabla');
  var t=td.closest('table'),tr=td.parentNode;
  if(c=='dtbl')t.remove();
  else if(c=='row'){var n=tr.cloneNode(true);n.querySelectorAll('td,th').forEach(function(x){x.innerHTML='<br>'});tr.after(n)}
  else{var i=td.cellIndex;t.querySelectorAll('tr').forEach(function(r){var c2=r.cells[i];if(c2){var n=c2.cloneNode(false);n.innerHTML='<br>';c2.after(n)}})}
  onEd();
}
function insImg(f){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var u=r.result;if(f.size>800000&&/jpe?g|png|webp/.test(f.type)&&im.width>1400){var c=document.createElement('canvas');c.width=1400;c.height=im.height*1400/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.88)}ex('insertHTML','<img src="'+u+'" style="max-width:100%">')};im.src=r.result};r.readAsDataURL(f)}
$('#fImg').onchange=function(e){Array.prototype.forEach.call(e.target.files,insImg);e.target.value=''};
function isImg(f){return f.type.indexOf('image/')==0}

sh.addEventListener('click',function(e){if(selImg)selImg.classList.remove('si');selImg=e.target.tagName=='IMG'?e.target:null;if(selImg)selImg.classList.add('si')});
sh.addEventListener('input',onEd);
function clean(h){return h.replace(/\s*class="si"/g,'')}
function onEd(){var t=sh.innerText.trim();$('#eWc').textContent=(t?t.split(/\s+/).length:0)+' palabras · '+t.length+' caracteres · ≈ '+Math.max(1,Math.ceil(sh.scrollHeight/1123))+' pág.';$('#eSt').textContent='Editando…';clearTimeout(saveT);saveT=setTimeout(saveDoc,900)}
async function saveDoc(){if(!cur)return;cur.name=$('#eName').value.trim()||'Documento';cur.blob=new Blob([clean(sh.innerHTML)],{type:'application/x-mi-doc'});cur.size=cur.blob.size;cur.modified=Date.now();try{await put(cur);$('#eSt').textContent='Guardado'}catch(e){$('#eSt').textContent='No se pudo guardar (¿sin espacio?)'}}

async function openDoc(n){cur=n;document.body.classList.add('ing');$('#ed').hidden=false;$('#eName').value=n.name;setMode('edit');sh.innerHTML=await n.blob.text()||'<p><br></p>';rg=null;applyMeta();onEd();$('#eSt').textContent='Guardado';sh.focus()}
async function closeDoc(){clearTimeout(saveT);await saveDoc();cur=null;applyMeta();$('#ed').hidden=true;document.body.classList.remove('ing','foc');render()}
async function expo(n,f,html){
  html=clean(html!==undefined?html:await n.blob.text());var t=n.name||'Documento',data,type,x;
  var css='body{font-family:Calibri,Arial,sans-serif;font-size:12pt;line-height:1.5}table{border-collapse:collapse}td,th{border:1px solid #888;padding:6px}img{max-width:100%}blockquote{border-left:4px solid #fca311;margin-left:0;padding-left:14px;color:#555}';
  if(f=='doc'){data='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(t)+'</title><style>'+css+'</style></head><body>'+html+'</body></html>';type='application/msword';x='.doc'}
  else if(f=='html'){data='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>'+esc(t)+'</title><style>'+css+'body{max-width:800px;margin:30px auto;padding:0 16px}</style></head><body>'+html+'</body></html>';type='text/html';x='.html'}
  else{var d=document.createElement('div');d.style.cssText='position:fixed;left:-9999px;white-space:pre-wrap';document.body.appendChild(d);d.innerHTML=html;data=d.innerText;d.remove();type='text/plain';x='.txt'}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));a.download=t.replace(/[\\/:*?"<>|]/g,'-')+x;document.body.appendChild(a);a.click();a.remove();toast('Exportado: '+a.download);
}

/* Copia de seguridad */
function b64(b){return new Promise(function(a){var r=new FileReader();r.onload=function(){a(r.result)};r.readAsDataURL(b)})}
$('#bExp').onclick=async function(){toast('Preparando copia…');var out=[];for(var i=0;i<N.length;i++){var n=N[i],o=Object.assign({},n);delete o.blob;if(n.blob)o.data=await b64(n.blob);out.push(o)}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='mi-espacio-copia-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Copia descargada')};
$('#bImp').onclick=function(){$('#fj').click()};
$('#fj').onchange=async function(e){var f=e.target.files[0];e.target.value='';if(!f)return;try{var arr=JSON.parse(await f.text());
  for(var i=0;i<arr.length;i++){var o=arr[i];if(o.data){o.blob=await (await fetch(o.data)).blob();delete o.data}await put(o);var k=N.findIndex(function(n){return n.id===o.id});if(k>-1)N[k]=o;else N.push(o)}
  render();toast('Copia restaurada')}catch(err){toast('Ese archivo no es una copia válida')}};

})();
